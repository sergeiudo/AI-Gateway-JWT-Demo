<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Request flow from Microsoft Entra through the token broker and AI gateway to the models">
  <rect x="0" y="0" width="1000" height="430" rx="6" fill="#151A2D"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.7" fill="#98A1BE">
    <text x="20" y="34">IDENTITY</text>
    <text x="352" y="34">BROKER AND GATEWAY</text>
    <text x="742" y="34">TARGETS</text>
  </g>

  <g fill="none" stroke="#2C3557" stroke-width="1.1">
    <path d="M 176 76  C 250 76, 280 104, 352 112"/>
    <path d="M 176 136 C 250 136, 280 120, 352 118"/>
    <path d="M 176 196 C 250 196, 280 140, 352 126"/>
    <path d="M 648 228 C 700 228, 700 152, 742 152"/>
    <path d="M 648 228 C 700 228, 700 186, 742 186"/>
    <path d="M 648 228 C 700 228, 700 220, 742 220"/>
  </g>
  <path d="M 500 152 L 500 196" fill="none" stroke="#C9973F" stroke-width="1.2"/>
  <path d="M 648 228 C 700 228, 700 84, 742 84" fill="none" stroke="#4FA396" stroke-width="1.4"/>
  <path d="M 648 228 C 700 228, 700 118, 742 118" fill="none" stroke="#C9973F" stroke-width="1.4"/>

  <g fill="#1D2440" stroke="#2C3557">
    <rect x="20" y="52" width="156" height="48" rx="4"/>
    <rect x="20" y="112" width="156" height="48" rx="4"/>
    <rect x="20" y="172" width="156" height="48" rx="4"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="600" fill="#F3EEE5">
    <text x="34" y="74">Microsoft Entra</text>
    <text x="34" y="134">Microsoft Graph</text>
    <text x="34" y="194">App role</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#98A1BE">
    <text x="34" y="90">signs the id token</text>
    <text x="34" y="150">department</text>
    <text x="34" y="210">admin or user</text>
  </g>

  <rect x="352" y="44" width="296" height="216" rx="10" fill="none" stroke="#C9973F" stroke-dasharray="5 4" opacity="0.55"/>
  <rect x="376" y="64" width="248" height="72" rx="5" fill="#C9973F" fill-opacity="0.16" stroke="#C9973F"/>
  <rect x="376" y="176" width="248" height="72" rx="5" fill="#C9973F" fill-opacity="0.16" stroke="#C9973F"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14.5" font-weight="600" fill="#F3EEE5">
    <text x="396" y="94">Token broker</text>
    <text x="396" y="206">AI gateway</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#98A1BE">
    <text x="396" y="111">rs256 &#183; private_key.pem</text>
    <text x="396" y="223">verifies against the jwks</text>
  </g>

  <g fill="#C9973F" fill-opacity="0.14" stroke="#C9973F" stroke-opacity="0.75">
    <rect x="352" y="284" width="142" height="26" rx="3"/>
    <rect x="506" y="284" width="142" height="26" rx="3"/>
    <rect x="352" y="318" width="142" height="26" rx="3"/>
    <rect x="506" y="318" width="142" height="26" rx="3"/>
    <rect x="352" y="352" width="142" height="26" rx="3"/>
    <rect x="506" y="352" width="142" height="26" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#C9973F">
    <text x="364" y="301">verify signature</text>
    <text x="518" y="301">read claims</text>
    <text x="364" y="335">config lock</text>
    <text x="518" y="335">match policy</text>
    <text x="364" y="369">route model</text>
    <text x="518" y="369">log identity</text>
  </g>

  <rect x="742" y="44" width="238" height="200" rx="5" fill="#1A2038" stroke="#2C3557"/>
  <text x="758" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.7" fill="#98A1BE">MODELS</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
    <text x="758" y="88" fill="#4FA396" font-weight="600">Claude Haiku 4.5</text>
    <text x="758" y="122" fill="#C9973F" font-weight="600">Claude Opus 4.8</text>
    <text x="758" y="156" fill="#CED4E6">Claude Sonnet 5</text>
    <text x="758" y="190" fill="#98A1BE">and 6 more models</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" text-anchor="end">
    <text x="964" y="88" fill="#4FA396">standard users</text>
    <text x="964" y="122" fill="#C9973F">admins</text>
    <text x="964" y="156" fill="#98A1BE">exempt only</text>
    <text x="964" y="190" fill="#98A1BE">exempt only</text>
  </g>

  <rect x="742" y="262" width="238" height="82" rx="5" fill="#1A2038" stroke="#2C3557"/>
  <text x="758" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.7" fill="#98A1BE">TRUST ANCHOR</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#98A1BE">
    <text x="758" y="303">public key registered as jwks</text>
    <text x="758" y="320">private key never leaves the app</text>
  </g>

  <circle cx="500" cy="176" r="4.5" fill="#C9973F"/>
  <circle cx="352" cy="118" r="4" fill="#4FA396"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5">
    <text x="742" y="372" fill="#4FA396">&#8212; identity claims</text>
    <text x="742" y="388" fill="#C9973F">&#8212; sealed credential</text>
  </g>
</svg>
