[theme]
base = "light"
primaryColor = "#FA582D"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1115"
borderColor = "#E7E7E4"
baseRadius = "9px"
buttonRadius = "999px"
font = "Inter, system-ui, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"

[theme.light]
primaryColor = "#FA582D"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1115"
borderColor = "#E7E7E4"
codeBackgroundColor = "#F4F4F2"

[theme.dark]
primaryColor = "#FF7A52"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#181B21"
textColor = "#F5F6F7"
borderColor = "#282D36"
codeBackgroundColor = "#14171C"

[theme.light.sidebar]
backgroundColor = "#F4F4F2"
borderColor = "#E7E7E4"

[theme.dark.sidebar]
backgroundColor = "#14171C"
borderColor = "#282D36"

[client]
# "viewer" keeps the theme toggle reachable under the toolbar menu while hiding the
# developer controls. "minimal" removes the menu entirely, taking the toggle with it.
toolbarMode = "viewer"
